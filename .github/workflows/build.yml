name: Build infstam dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1.5

      - name: Build
        run: |
          make clean || true
          make FINALPACKAGE=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infstam-dylib
          path: |
            .theos/obj/**/*.dylib
            packages/*.deb
